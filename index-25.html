<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Vansh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4ecd8;
    --night:#12102a;
    --night2:#1c1740;
    --plum:#2b1e3d;
    --gold:#e3b158;
    --gold-dim:#a9884f;
    --rose:#e08a95;
    --line: rgba(244,236,216,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, var(--night2) 0%, var(--night) 55%, #0a0818 100%);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient stars */
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .stars span{
    position:absolute; width:2px;height:2px;background:var(--ink);
    border-radius:50%; opacity:0.5; animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}

  /* ---------- LOCK SCREEN ---------- */
  #lock{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #lock.hidden{opacity:0; visibility:hidden; pointer-events:none;}

  .invite{
    width:100%; max-width:400px;
    background: linear-gradient(180deg, rgba(43,30,61,0.9), rgba(18,16,42,0.95));
    border:1px solid var(--line);
    border-radius:4px;
    padding:48px 36px 40px;
    text-align:center;
    position:relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  .invite::before, .invite::after{
    content:'';
    position:absolute; left:20px; right:20px; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  .invite::before{top:16px;}
  .invite::after{bottom:16px;}

  .seal{
    width:56px;height:56px;margin:0 auto 20px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #eecb84, var(--gold) 55%, #9a7431 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 6px 18px rgba(227,177,88,0.35), inset 0 -4px 6px rgba(0,0,0,0.25);
    font-size:24px;
  }
  .eyebrow{
    letter-spacing:0.3em; text-transform:uppercase; font-size:11px;
    color: var(--gold-dim); margin-bottom:10px; font-weight:500;
  }
  .invite h1{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size:clamp(28px,7vw,34px); margin:0 0 8px; color:var(--ink);
    line-height:1.15;
  }
  .invite p.sub{
    color:rgba(244,236,216,0.65); font-size:14px; margin:0 0 30px;
    font-weight:300;
  }
  .field{
    display:flex; flex-direction:column; gap:8px; text-align:left; margin-bottom:18px;
  }
  .field label{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--gold-dim);
  }
  .field input{
    background: rgba(0,0,0,0.25);
    border:1px solid var(--line);
    border-radius:2px;
    padding:13px 14px;
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    letter-spacing:0.05em;
    outline:none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .field input:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(227,177,88,0.15);
  }
  #unlockBtn{
    width:100%;
    background: linear-gradient(180deg, var(--gold), #c99a45);
    color:#241a08;
    border:none;
    padding:13px 14px;
    border-radius:2px;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #unlockBtn:hover{ transform:translateY(-1px); box-shadow:0 10px 24px rgba(227,177,88,0.28); }
  #unlockBtn:active{ transform:translateY(0px); }

  #errMsg{
    min-height:18px; margin-top:14px; font-size:12.5px; color:var(--rose);
    letter-spacing:0.02em;
  }
  .invite .hint{
    margin-top:22px; font-size:11.5px; color:rgba(244,236,216,0.35);
  }

  .shake{ animation: shake 0.45s; }
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }

  /* ---------- MAIN CONTENT ---------- */
  #content{
    position:relative; z-index:1;
    opacity:0; transition:opacity 1s ease 0.15s;
  }
  #content.show{opacity:1;}

  section{ padding:50px 20px; max-width:900px; margin:0 auto; }

  /* HERO */
  .hero{
    text-align:center; padding-top:40px; padding-bottom:30px;
    position:relative;
  }
  .hero h1{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:clamp(40px, 10vw, 92px);
    line-height:1.08;
    margin:0;
    background: linear-gradient(180deg, var(--ink) 40%, var(--gold) 130%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* CANDLE */
  .candle-wrap{
    display:flex; justify-content:center; margin:32px 0 14px;
  }
  .candle{ position:relative; width:26px; height:150px; }

  /* ambient light pooling behind the flame */
  .glow{
    position:absolute; left:50%; bottom:118px; transform:translateX(-50%);
    width:120px; height:120px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,180,90,0.35) 0%, rgba(255,150,60,0.12) 45%, transparent 72%);
    animation: glow-pulse 1.8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes glow-pulse{
    0%,100%{ opacity:0.75; transform:translateX(-50%) scale(0.94); }
    50%{ opacity:1; transform:translateX(-50%) scale(1.05); }
  }
  .glow{ display:none; }
  .candle:not(.blown) .glow{ display:block; }

  /* wax body with a subtle tapered, waxy look */
  .candle .stick{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:26px; height:112px;
    background: linear-gradient(90deg,#fffaf0 0%, #f7e8c8 18%, #ecd6a3 50%, #f7e8c8 82%, #fffaf0 100%);
    border-radius:4px 4px 2px 2px;
    box-shadow:
      inset -4px 0 6px rgba(150,110,40,0.18),
      inset 4px 0 6px rgba(255,255,255,0.5),
      0 10px 20px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .candle .stripe{
    position:absolute; left:0; width:26px; height:9px;
    background: linear-gradient(90deg, var(--rose), #eaa4ac 50%, var(--rose));
    opacity:0.85;
  }
  /* wax drips */
  .drip{
    position:absolute; top:-2px; width:7px; border-radius:0 0 6px 6px;
    background: linear-gradient(180deg,#fffdf6,#f0dcae);
    box-shadow: inset -2px 0 3px rgba(150,110,40,0.2);
  }
  .drip1{ left:3px; height:26px; }
  .drip2{ left:16px; height:16px; }

  /* wick */
  .wick{
    position:absolute; left:50%; bottom:110px; transform:translateX(-50%);
    width:2.5px; height:9px; background:#3a2e22; border-radius:1px;
    z-index:3;
  }

  /* candle holder */
  .holder{
    position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    width:56px; height:14px; border-radius:50%;
    background: radial-gradient(ellipse at 40% 30%, #f0d488, var(--gold) 55%, #a9884f 100%);
    box-shadow: 0 10px 22px rgba(0,0,0,0.4);
  }

  .flame{
    position:absolute; left:50%; bottom:117px; transform-origin:50% 100%;
    width:22px; height:38px; margin-left:-11px;
    cursor:pointer; z-index:4;
    animation: sway 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 16px rgba(255,160,60,0.75)) drop-shadow(0 0 32px rgba(255,120,40,0.4));
  }
  .flame-outer{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 68%, #fff7d6 0%, #ffd873 30%, #ff9d3c 62%, #e6592a 82%, transparent 88%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    animation: flicker-outer 1.4s ease-in-out infinite;
  }
  .flame-inner{
    position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    width:9px; height:16px;
    background: radial-gradient(circle at 50% 75%, #ffffff 0%, #fff2c4 40%, #ffcf72 70%, transparent 85%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    animation: flicker-inner 1.1s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-3deg); }
    25%{ transform: rotate(2deg); }
    50%{ transform: rotate(-1deg); }
    75%{ transform: rotate(3deg); }
  }
  @keyframes flicker-outer{
    0%,100%{ transform:scale(1,1); opacity:1; }
    45%{ transform:scale(1.08,1.16); opacity:0.94; }
    70%{ transform:scale(0.94,0.96); opacity:1; }
  }
  @keyframes flicker-inner{
    0%,100%{ transform:translateX(-50%) scale(1,1); }
    50%{ transform:translateX(-50%) scale(0.88,1.12); }
  }

  .flame.out{
    animation:none;
    opacity:0;
    transform: translateX(-50%) scale(0.3);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .candle.blown .wick{ background:#2a2018; }

  /* thin smoke wisp after blowing out */
  .smoke{
    position:absolute; left:50%; bottom:126px; width:3px; height:3px;
    transform:translateX(-50%);
    background:rgba(200,200,200,0.5); border-radius:50%;
    opacity:0; pointer-events:none;
  }
  .smoke.rise{ animation: smoke-rise 1.6s ease-out forwards; }
  @keyframes smoke-rise{
    0%{ opacity:0.6; transform:translateX(-50%) translateY(0) scale(1); }
    100%{ opacity:0; transform:translateX(-50%) translateY(-70px) scale(6) rotate(20deg); }
  }

  .blow-hint{ text-align:center; font-size:12px; color:rgba(244,236,216,0.4); margin-top:16px; letter-spacing:0.05em;}

  /* GALLERY */
  .section-head{ text-align:center; margin-bottom:28px; }
  .section-head .eyebrow{ color:var(--gold-dim); }
  .section-head h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:clamp(30px,5vw,44px);
    margin:10px 0 0; color:var(--ink);
  }

  .gallery{
    display:flex; flex-wrap:wrap; justify-content:center; gap:24px 20px;
    padding:10px 0 10px;
  }
  .polaroid{
    background:#f4ecd8;
    padding:14px 14px 46px;
    width:230px;
    border-radius:2px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    position:relative;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .polaroid:nth-child(1){ transform: rotate(-6deg); }
  .polaroid:nth-child(2){ transform: rotate(4deg); }
  .polaroid:nth-child(3){ transform: rotate(-3deg); }
  .polaroid:hover{ transform: rotate(0deg) scale(1.04) translateY(-6px); box-shadow:0 26px 50px rgba(0,0,0,0.55); z-index:5;}
  .polaroid img{ width:100%; display:block; border-radius:1px; filter:saturate(1.05); }
  .polaroid .cap{
    position:absolute; bottom:12px; left:0; right:0; text-align:center;
    font-family:'Fraunces', serif; font-style:italic; color:#2b1e3d; font-size:14px;
  }
  .tape{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:60px; height:22px;
    background: rgba(227,177,88,0.35);
    border:1px solid rgba(227,177,88,0.5);
  }

  /* MESSAGE */
  .message{
    text-align:center;
  }
  .message blockquote{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:clamp(20px,3.6vw,28px); line-height:1.6;
    color:var(--ink); margin:0 0 16px; padding:0 10px;
  }
  .message .from{
    color:var(--gold-dim); font-size:13px; letter-spacing:0.1em; text-transform:uppercase;
  }
  .divider{
    width:60px;height:1px;margin:0 auto 18px;
    background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  /* WISH BUTTON / CONFETTI TRIGGER */
  .wish-wrap{ text-align:center; margin-top:28px; }
  #confettiBtn{
    background:transparent;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    padding:14px 34px;
    border-radius:2px;
    font-family:'Work Sans',sans-serif;
    letter-spacing:0.12em; text-transform:uppercase; font-size:12.5px;
    cursor:pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }
  #confettiBtn:hover{ background:var(--gold); color:#241a08; }

  footer{
    text-align:center; padding:24px 20px 30px; color:rgba(244,236,216,0.3);
    font-size:12px; letter-spacing:0.05em;
  }

  canvas#confettiCanvas{
    position:fixed; inset:0; pointer-events:none; z-index:40;
  }

  @media (max-width:480px){
    .invite{padding:40px 24px 32px;}
    .polaroid{ width:78vw; max-width:260px; }
    section{padding:36px 18px;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<canvas id="confettiCanvas"></canvas>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="invite">
    <div class="seal">🎂</div>
    <div class="eyebrow">A private invitation for</div>
    <h1>Vansh</h1>
    <p class="sub">This little corner of the internet is locked just for you.</p>
    <div class="field">
      <label for="pw">Password</label>
      <input type="password" id="pw" placeholder="Enter the password" autocomplete="off">
    </div>
    <button id="unlockBtn">Unlock the surprise</button>
    <div id="errMsg"></div>
    <div class="hint">Hint: it's someone's name.</div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="content">

  <section class="hero">
    <h1>Happy Birthday<br>Vansh</h1>

    <div class="candle-wrap">

        <div class="flame" id="flame">
          <div class="flame-outer"></div>

        </div>
        <div class="wick"></div>
        <div class="stick">
          <div class="drip drip1"></div>
          <div class="drip drip2"></div>
          <div class="stripe" style="top:14px;"></div>
          <div class="stripe" style="top:38px;"></div>
          <div class="stripe" style="top:58px;"></div>
        </div>
        <div class="holder"></div>
      </div>
    </div>
    <div class="blow-hint">tap the flame to make a wish ✨</div>
  </section>

  <section class="message">
    <div class="divider"></div>
    <blockquote>"happy birthday yarr "</blockquote>
    <div class="from">— with love, your friend</div>

    <div class="wish-wrap">
      <button id="confettiBtn">Celebrate 🎉</button>
    </div>
  </section>

  <footer>made with ❤️ for Vansh's birthday</footer>
</div>

<script>
  // ambient stars
  const starsEl = document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    starsEl.appendChild(s);
  }

  // password gate
  const CORRECT = 'vansh';
  const lock = document.getElementById('lock');
  const content = document.getElementById('content');
  const pwInput = document.getElementById('pw');
  const unlockBtn = document.getElementById('unlockBtn');
  const errMsg = document.getElementById('errMsg');
  const invite = document.querySelector('.invite');

  function tryUnlock(){
    const val = pwInput.value.trim().toLowerCase();
    if(val === CORRECT){
      lock.classList.add('hidden');
      content.classList.add('show');
      launchConfetti(120);
    } else {
      errMsg.textContent = 'Not quite — try again.';
      invite.classList.remove('shake');
      void invite.offsetWidth;
      invite.classList.add('shake');
    }
  }
  unlockBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

  // candle blow
  const flame = document.getElementById('flame');
  const candleEl = document.querySelector('.candle');
  let blown = false;
  flame.addEventListener('click', ()=>{
    if(blown) return;
    blown = true;
    flame.classList.add('out');
    candleEl.classList.add('blown');
    const smoke = document.createElement('div');
    smoke.className = 'smoke';
    candleEl.appendChild(smoke);
    requestAnimationFrame(()=> smoke.classList.add('rise'));
    setTimeout(()=> smoke.remove(), 1700);
    launchConfetti(90);
  });

  // confetti button
  document.getElementById('confettiBtn').addEventListener('click', ()=> launchConfetti(140));

  // confetti engine
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#e3b158','#e08a95','#f4ecd8','#c99a45','#8a6bab'];
  let particles = [];

  function launchConfetti(count){
    for(let i=0;i<count;i++){
      particles.push({
        x: Math.random()*canvas.width,
        y: -20 - Math.random()*canvas.height*0.3,
        r: 4+Math.random()*5,
        c: colors[Math.floor(Math.random()*colors.length)],
        vx: (Math.random()-0.5)*2.4,
        vy: 2+Math.random()*3.2,
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*10,
        life: 0
      });
    }
    if(!animating){ animating = true; requestAnimationFrame(animate); }
  }

  let animating = false;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      ctx.restore();
    });
    particles = particles.filter(p=> p.y < canvas.height+30 && p.life < 500);
    if(particles.length>0){
      requestAnimationFrame(animate);
    } else {
      animating = false;
    }
  }
</script>
